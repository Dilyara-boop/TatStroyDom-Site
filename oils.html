<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Масла для дерева — ТатСтройДом</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f4ef;
            color: #142b44;
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 40px;
            color: #d9343a;
            text-decoration: none;
            font-weight: 700;
        }

        .hero {
            background: linear-gradient(135deg, #142b44 0%, #25435f 100%);
            color: #ffffff;
            border-radius: 28px;
            padding: 60px;
        }

        .hero span {
            display: block;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 16px;
            color: rgba(255,255,255,.7);
        }

        .hero h1 {
            margin: 0 0 20px;
            font-size: 48px;
            line-height: 1.1;
        }

        .hero p {
            max-width: 720px;
            margin: 0;
            font-size: 18px;
            line-height: 1.7;
            color: rgba(255,255,255,.82);
        }

        @media (max-width: 700px) {
            .hero {
                padding: 36px 24px;
            }

            .hero h1 {
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <main class="page-container">

        <a href="index.html#finishing" class="back-link">
            ← Вернуться на главную
        </a>

        <section class="hero">
            <span>МАСЛА ДЛЯ ДЕРЕВА</span>

            <h1>
                Защита древесины с сохранением её естественной красоты
            </h1>

            <p>
                Подберём масло для фасада, интерьера, террас и других деревянных
                поверхностей с учётом породы древесины и условий эксплуатации.
            </p>
        </section>

    </main>

</body>
</html>
